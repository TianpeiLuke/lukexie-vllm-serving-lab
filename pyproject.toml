[project]
name = "lukexie-vllm-serving-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "modal>=1.6.3",
    "openai>=3.46.0",
]

[dependency-groups]
dev = [
    "numpy>=2.5.4",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]  # tests import results.record, client.timing from the repo root
